# LLM 判斷點登錄(第二階段):agent-hub 裡每一次 `claude -p` 都要經過 bin/llm.py,而且要是這裡宣告過的判斷點。
# 每個點:誰呼叫、做什麼判斷、用哪個模型、權限、能用的工具、輸出 schema、模型不能用/輸出不合格時怎麼辦。
# contracts-check 每晚 lint:bin/ 裡出現 claude -p 卻不在 bin/llm.py(也不在 exempt)就失敗。
#
# 格式:contracts/llm-points.v1.schema.json(跟 muninn 共用格式,它 vendor 一份;內容不共用)。
# output:{format: json, schema: <相對這個目錄>} 或 {format: text}。
#
# on_failure = 模型沒回或輸出不合格時「實際發生什麼事」(兩邊同一組值;每個點的標記是讀呼叫端的程式整理的):
#   skip        這次不做、不留結果            retry_later  不推進進度,下一輪再試
#   ask_user    改成問 Knas                   say_so       明白說模型沒回(狀態頁、警報、事件)
#   default     用安全結果:登錄有寫 default 值就由 llm.py 回那個值,否則由呼叫端提供
# llm.py 的機制:登錄有 `default` 值 → 印 {"is_error": true, "structured_output": <default>}、exit 0;
#   其他一律 structured_output: null、exit 1,呼叫端走它自己的失敗路徑(上面標的就是那條路徑做的事)。
# 不管哪種都在匯流排記 job.failed(point、原因)。
#
# shape:completion(模型沒有工具、只回答案;hub.json 有 llm 區塊時交給 completion.py,任何 provider)| agent(coding agent)。
# model_group:fast | standard | strong——要多強的模型,不寫哪一家的名字;hub.json llm 決定交給誰、用哪個模型
#   (舊的 model_env / model_default 是沒有 llm 區塊時給 runtime.default 用的,過渡期保留)。
# auth:token(預設,~/.claude/headless-oauth-token)| subscription(訂閱登入;claude.ai connector 只有這樣才載入)。
#   呼叫端的 LLM_AUTH 環境變數優先(登錄 job 的 connectors: true 會設 LLM_AUTH=subscription)。
v: 1
points:
  librarian-state:
    caller: bin/librarian.sh
    shape: agent
    model_group: fast
    extra_args: ["--strict-mcp-config"]   # 不載入環境裡的 MCP(全域的含正式資料庫;關掉工具也擋不掉,10-27 實驗)
    purpose: 每晚依 memory 變動與 Muninn 轉交,決定要不要、怎麼更新一個專案的 STATE.md(只准改 ./STATE.md)
    model_env: STATE_MODEL
    model_default: haiku
    permission_mode: dontAsk
    tools: Read,Write,Edit,Glob,Grep
    allowed_tools: ["Edit(./STATE.md)"]
    output: {format: json, schema: llm/librarian-state.schema.json}
    timeout_s: 1200
    on_failure: retry_later # checkpoint 不推進,隔晚重試
  librarian-todo-format:
    caller: bin/librarian.sh
    shape: agent
    model_group: fast
    extra_args: ["--strict-mcp-config"]   # 不載入環境裡的 MCP(全域的含正式資料庫;關掉工具也擋不掉,10-27 實驗)
    purpose: STATE.md 的 `## 待辦` 格式不對時,只修格式、內容不動
    model_env: STATE_MODEL
    model_default: haiku
    permission_mode: dontAsk
    tools: Read,Edit
    allowed_tools: ["Edit(./STATE.md)"]
    timeout_s: 600
    output: {format: text}
    on_failure: skip        # 修不好就留著,check-state-todo 會再檢查、todo.md 檔尾列出
  librarian-index:
    caller: bin/librarian.sh
    shape: agent
    model_group: standard
    extra_args: ["--strict-mcp-config"]   # 不載入環境裡的 MCP(全域的含正式資料庫;關掉工具也擋不掉,10-27 實驗)
    purpose: 更新跨專案 index.md 名冊區塊外的註記、找跨專案關聯
    model_env: INDEX_MODEL
    model_default: sonnet
    permission_mode: acceptEdits
    tools: Read,Write,Edit,Glob,Grep
    output: {format: json, schema: llm/librarian-index.schema.json}
    timeout_s: 1200
    on_failure: skip        # index.md 的註記這晚不更新;名冊區塊照常由腳本重生
  consolidate:
    caller: bin/consolidate-memory.py
    shape: agent
    model_group: strong
    purpose: 把超過 14 天的 memory 日期檔整理進 reference/、修正被推翻的敘述(只准改 memory/reference/ 跟 STATE.md)
    model_env: CONSOLIDATE_MODEL
    model_default: opus
    permission_mode: dontAsk
    tools: Read,Write,Edit,Glob,Grep
    allowed_tools: ["Edit(./memory/reference/**)", "Edit(./STATE.md)"]
    extra_args: ["--strict-mcp-config", "--no-session-persistence"]
    output: {format: json, schema: llm/consolidate.schema.json}
    timeout_s: 1200
    on_failure: retry_later # 那個專案這次不整理,2 天後再試
  reflect-week:
    caller: bin/reflect_llm.py
    shape: completion
    model_group: standard
    extra_args: ["--strict-mcp-config"]   # 不載入環境裡的 MCP(全域的含正式資料庫;關掉工具也擋不掉,10-27 實驗)
    purpose: 每週活動分析(只拿統計 + muninn 的 session 摘要,不拿對話原文)
    model_env: INDEX_MODEL
    model_default: sonnet
    tools: ""
    output: {format: json, schema: llm/reflect-week.schema.json}
    timeout_s: 1200
    on_failure: say_so      # 呼叫端只放統計、標「模型呼叫失敗」
  agent-job:
    caller: bin/run-agent-job.sh
    shape: agent
    model_group: standard
    purpose: "排程的 Claude job(專案登錄的 kind: agent);prompt 是 job 自己的"
    # 無人值守:job 在登錄宣告了 allow: → dontAsk + --permission-prompts none + 只准那些規則(沒列的一律拒絕,
    # 不會卡在提示);沒宣告的暫時維持 auto(不是 bypass),狀態頁列出來。永遠不用 bypassPermissions。
    permission_mode: auto
    allow_from_env: AGENT_JOB_ALLOW
    timeout_s: 3600
    output: {format: text}
    on_failure: say_so      # job 失敗,狀態頁標紅
  login-check:
    caller: bin/check-claude-login.py
    shape: agent
    model_group: fast
    extra_args: ["--strict-mcp-config"]   # 不載入環境裡的 MCP(全域的含正式資料庫;關掉工具也擋不掉,10-27 實驗)
    purpose: "每小時確認 claude 的登入還能用(launchd 底下的訂閱登入、headless token 各打一次最小的請求);壞了發 Discord"
    auth: subscription            # 檢查 token 那次呼叫端設 LLM_AUTH=token
    model_default: haiku
    tools: ""
    timeout_s: 120
    output: {format: text}
    on_failure: say_so      # 發 Discord 警報
  mailbox-escalation:
    caller: bin/hubbus(dispatch → run-agent-job.sh)
    shape: agent
    model_group: standard
    purpose: "專案信箱的交辦沒人收(專案沒人在用,或等了幾分鐘):在那個專案開 headless session,只寫 memory 筆記、回信、問 owner"
    permission_mode: dontAsk
    prompts: none
    tools: Read,Edit,Write,Glob,Grep,Bash
    allowed_tools: ["Edit(./.agent-memory/memory/**)", "{platform_mail}"]   # {platform_mail}:平台的收信、寄信、結案指令(runtime 翻成自己的規則)
    timeout_s: 1800
    output: {format: text}
    on_failure: say_so      # bridge 回報升級失敗
  mailbox-conversation:
    caller: bin/hubbus(dispatch → llm.py run,帶 runtime_claude.resume_args)
    shape: agent
    model_group: standard
    purpose: "對話的回信送到一個閒置的 session:用它的 context 在背景接續(分支副本,不動原本的 session),只寫筆記、回信、問 owner"
    model_env: LEASE_MODEL
    model_default: sonnet
    # 權限跟 mailbox-escalation 一樣,不沿用原本 session 的權限模式(它可能是 acceptEdits/auto,沒人看著不能照用)
    permission_mode: dontAsk
    prompts: none
    tools: Read,Edit,Write,Glob,Grep,Bash
    allowed_tools: ["Edit(./.agent-memory/memory/**)", "{platform_mail}"]   # {platform_mail}:平台的收信、寄信、結案指令(runtime 翻成自己的規則)
    extra_args: ["--strict-mcp-config"]   # 不載入專案的 MCP 伺服器(例:project-06 的正式資料庫),背景副本用不到
    timeout_s: 1800
    output: {format: text}
    on_failure: retry_later  # 失敗記 job.failed;35 分鐘還沒結案,dispatch 改派交辦(stale_resumes)
  lease-session:
    caller: bin/lease-runner.py(llm.py exec)
    shape: agent
    model_group: standard
    purpose: "通道租借的 discuss session:長駐的 stream-json 程序,Knas 透過 Muninn 跟專案深談;唯讀"
    model_env: LEASE_MODEL
    model_default: sonnet
    # 只給讀的工具;讀類規則放行(不送到轉接),不在登錄網域的 WebFetch、AskUserQuestion 走權限轉接(送到手機)
    tools: Read,Glob,Grep,WebSearch,WebFetch,AskUserQuestion
    allowed_tools: ["Read", "Glob", "Grep", "WebSearch", "mcp__lease_relay__show_file"]   # show_file:把專案裡的檔案給使用者看(docs/design/lease-show-file.md)
    extra_allow_env: LEASE_ALLOW        # runner 加:登錄 network 網域的 WebFetch(domain:…)
    stream: true
    output: {format: text}
    on_failure: say_so      # runner 發 process_crashed 事件,手機上看得到
  lease-work:
    caller: bin/lease-runner.py(llm.py exec)
    shape: agent
    model_group: standard
    purpose: "通道租借的 work session(第二階段,只限想法沙盒):Knas 允許動手後,可以改這個專案的檔案、跑指令,每次都先問他"
    model_env: LEASE_MODEL
    model_default: sonnet
    # 沒有 permission_mode / prompts:寫入要走權限轉接(--permission-prompt-tool)送手機;dontAsk 會在那之前就拒絕。
    # 自動放行的還是只有讀;Edit/Write/Bash 全部經過 lease-relay.py(資料夾外直接拒絕,其他問 Knas)。
    tools: Read,Glob,Grep,WebSearch,WebFetch,AskUserQuestion,Edit,Write,NotebookEdit,Bash
    allowed_tools: ["Read", "Glob", "Grep", "WebSearch", "mcp__lease_relay__show_file"]
    extra_allow_env: LEASE_ALLOW
    stream: true
    output: {format: text}
    on_failure: say_so     # runner 發 process_crashed 事件,手機上看得到
  lease-handover:
    caller: bin/lease-runner.py
    shape: agent
    model_group: standard
    purpose: "收回租約時:接回同一個 session,寫結構化交接(摘要、決定、未決問題、Knas 要做的事、memory 筆記)"
    model_env: LEASE_MODEL
    model_default: sonnet
    tools: ""
    output: {format: json, schema: llm/lease-handover.schema.json}
    timeout_s: 600
    on_failure: default     # runner 重試一次,再不行產生最小交接(fallback: true)——安全結果由 runner 提供,不是登錄
exempt:
  - file: bin/trajectory.py
    reason: Knas 2026-10-22 決定 4B——手動跑的工具,先維持原樣
