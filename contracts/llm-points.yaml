# LLM judgment point registry (phase two): every `claude -p` in agent-hub must go through bin/llm.py and be a judgment
# point declared here.
# Each point: who calls it, what it judges, which model, permissions, the tools it may use, the output schema, what
# happens when the model is unavailable/the output is invalid.
# contracts-check lints nightly: a claude -p in bin/ that is not in bin/llm.py (nor in exempt) fails.
#
# Format: contracts/llm-points.v1.schema.json (a format shared with muninn, which vendors a copy; the contents are not
# shared).
# output: {format: json, schema: <relative to this directory>} or {format: text}.
#
# on_failure = "what actually happens" when the model does not answer or the output is invalid (the same set of values
# on both sides; each point's mark was worked out by reading the caller's code):
#   skip        don't do it this time, keep no result    retry_later  don't advance progress, try again next round
#   ask_user    ask the owner instead                    say_so       say plainly that the model did not answer
#                                                                     (status page, alert, event)
# default     use a safe result: if the registry has a default value llm.py returns it, otherwise the caller supplies
# one
# llm.py's mechanism: registry has a `default` value → prints {"is_error": true, "structured_output": <default>}, exit
# 0;
#   everything else is structured_output: null, exit 1, and the caller takes its own failure path (what is marked above
#   is what that path does).
# Either way, job.failed (point, reason) is recorded on the bus; except through llm.answer (mailbox-route), which prints
#   and publishes nothing, since a reason can quote the model: its caller says in fixed words that there was no answer.
# max_attempts: the most requests one completion call makes, every retry counted (1: none).
#
# shape: completion (the model has no tools and only returns an answer; when hub.json has an llm block it goes to
#   completion.py, any provider) | agent (coding agent).
# model_group: fast | standard | strong: how strong a model, never naming a provider; default = unspecified, use the
#   tool's own default (agent points only).
#   group → model: the runtime's adapter (runtime_<name>.MODELS) or the models of hub.json llm.providers;
#   overrides for individual judgment points go in hub.json llm.points.<point>.model (schedulectl set-model). The
#   algorithm lives only in llm.model_for.
# auth: token (default, ~/.claude/headless-oauth-token) | subscription (subscription login; claude.ai connectors load
#   only this way).
#   The caller's LLM_AUTH environment variable takes precedence (a registry job's connectors: true sets
#   LLM_AUTH=subscription).
# restricted: no settings file is loaded (a runtime without confined runs: only in the throwaway copy, or it fails).
# works_in: memory: its folder is a copy of a project's memory branch: llm.py checks the files first, on every runtime (bin/memory_paths.py), and
#   a folder that passes doesn't need the throwaway copy; there restricted only reinforces.
# tool_servers: allowed_only: when the run loads the tool servers configured in its environment (a registry job's
#   connectors: true; the platform holds every other run of these points to its own servers), each server whose tools
#   its allow list doesn't name is denied whole. Which servers it would load is found by the runtime for that run
#   (policy.tool_server_denials, docs/design/evaluators.md step 0); when that can't be told, the run doesn't happen.
v: 1
points:
  librarian-state:
    caller: bin/librarian.py
    shape: agent
    model_group: fast
    # don't load the environment's MCP (the global ones include production databases; turning tools off doesn't block
    # them, 10-27 experiment)
    extra_args: ["--strict-mcp-config"]
    purpose: nightly, from memory changes and the assistant's handoffs, decide whether and how to update a project's STATE.md (may only change ./STATE.md)
    # it runs as the user in a copy of the branch, and a hook in a settings file there would run too
    restricted: true
    works_in: memory
    permission_mode: dontAsk
    tools: Read,Write,Edit,Glob,Grep
    allowed_tools: ["Edit(./STATE.md)"]
    output: {format: json, schema: llm/librarian-state.schema.json}
    timeout_s: 1200
    on_failure: retry_later # checkpoint not advanced, retried the next night
  librarian-todo-format:
    caller: bin/librarian.py
    shape: agent
    model_group: fast
    # don't load the environment's MCP (the global ones include production databases; turning tools off doesn't block
    # them, 10-27 experiment)
    extra_args: ["--strict-mcp-config"]
    purpose: when the to-do section of STATE.md (state-todo contract) is malformed, fix only the format, leaving the content unchanged
    restricted: true
    works_in: memory
    permission_mode: dontAsk
    tools: Read,Edit
    allowed_tools: ["Edit(./STATE.md)"]
    timeout_s: 600
    output: {format: text}
    # if it can't be fixed it stays; check-state-todo checks again and the end of todo.md lists it
    on_failure: skip
  librarian-index:
    caller: bin/librarian.py
    shape: agent
    model_group: standard
    # don't load the environment's MCP (the global ones include production databases; turning tools off doesn't block
    # them, 10-27 experiment)
    extra_args: ["--strict-mcp-config"]
    purpose: update the notes outside the roster block of the cross-project index.md, find cross-project links
    permission_mode: acceptEdits
    tools: Read,Write,Edit,Glob,Grep
    output: {format: json, schema: llm/librarian-index.schema.json}
    timeout_s: 1200
    # index.md's notes are not updated this night; the roster block is regenerated by the script as usual
    on_failure: skip
  librarian-state-edits:
    caller: bin/librarian.py (shadow mode, runs alongside librarian-state every night, comparing only, never writing; in charge instead of it when hub.json librarian.completion.state is on)
    shape: completion
    model_group: fast
    purpose: "the completion version of librarian-state: the platform puts STATE.md, AGENT.md, memory changes and handoffs in the prompt, the model returns a list of edits"
    output: {format: json, schema: llm/librarian-state-edits.schema.json}
    max_tokens: 8192
    timeout_s: 600
    # shadow: a failure is only recorded in the shadow log; the real STATE.md is handled by librarian-state as usual
    on_failure: skip
  librarian-index-edits:
    caller: bin/librarian.py (shadow mode, runs alongside librarian-index, comparing only, never writing; in charge instead of it when hub.json librarian.completion.index is on)
    shape: completion
    model_group: standard
    purpose: "the completion version of librarian-index: the platform puts index.md and today's digest in the prompt, the model returns a list of edits outside the roster block"
    output: {format: json, schema: llm/librarian-index-edits.schema.json}
    max_tokens: 8192
    timeout_s: 600
    on_failure: skip        # shadow: a failure is only recorded in the shadow log
  librarian-todo-format-edits:
    caller: bin/librarian.py (shadow mode, runs alongside librarian-todo-format whenever a to-do section is malformed, comparing only, never writing; in charge instead of it when hub.json librarian.completion.todo_format is on)
    shape: completion
    model_group: fast
    purpose: "the completion version of librarian-todo-format: the platform puts STATE.md and check-state-todo's problems in the prompt, the model returns a list of edits that fix only the format"
    output: {format: json, schema: llm/librarian-todo-format-edits.schema.json}
    max_tokens: 8192
    timeout_s: 600
    on_failure: skip        # shadow: a failure is only recorded in the shadow log; in charge, the section stays and the end of todo.md lists it
  consolidate:
    caller: bin/consolidate-memory.py
    shape: agent
    model_group: strong
    purpose: fold memory date files older than 14 days into reference/ and correct statements that were overturned (may only change memory/reference/ and STATE.md)
    restricted: true
    works_in: memory
    permission_mode: dontAsk
    tools: Read,Write,Edit,Glob,Grep
    allowed_tools: ["Edit(./memory/reference/**)", "Edit(./STATE.md)"]
    extra_args: ["--strict-mcp-config", "--no-session-persistence"]
    output: {format: json, schema: llm/consolidate.schema.json}
    timeout_s: 1200
    on_failure: retry_later # that project is not consolidated this time; tried again 2 days later
  first-look:
    caller: bin/first-look.py
    shape: completion
    model_group: standard
    purpose: "a newly connected project's first STATE.md, from its README, recent commit titles and top-level files (read through git as the project), so the owner sees a result the day they connect it, before any notes exist"
    tools: ""
    output: {format: json, schema: llm/first-look.schema.json}
    max_tokens: 6000
    timeout_s: 600
    on_failure: say_so      # the placeholder STATE.md stays; the librarian writes it once notes arrive
  reflect-week:
    caller: bin/reflect_llm.py
    shape: completion
    model_group: standard
    # don't load the environment's MCP (the global ones include production databases; turning tools off doesn't block
    # them, 10-27 experiment)
    extra_args: ["--strict-mcp-config"]
    purpose: weekly activity analysis (takes only statistics + the assistant's session summaries, never conversation text)
    tools: ""
    output: {format: json, schema: llm/reflect-week.schema.json}
    timeout_s: 1200
    on_failure: say_so      # the caller includes only the statistics and marks "model call failed"
  agent-job:
    caller: bin/run-agent-job.sh
    shape: agent
    model_group: default
    purpose: "scheduled Claude jobs (kind: agent in the project registry, or schedule.yaml) that declare no allow:; the
      prompt is the job's own"
    # A job that declares allow: never runs here: run-agent-job.sh sends it to agent-job-confined. One that doesn't
    # stays on auto for now (not bypass), with the project's saved settings, listed on the status page. Never
    # bypassPermissions.
    permission_mode: auto
    tool_servers: allowed_only
    # which project the job is (registry.py sets it for every agent job): a sandboxed project's is refused here, since
    # this point loads the project's saved permissions (llm.py; docs/design/project-agent-calls.md A2)
    project_env: AGENT_JOB_PROJECT
    timeout_s: 3600
    output: {format: text}
    on_failure: say_so      # the job fails, status page red
  agent-job-confined:
    caller: bin/run-agent-job.sh (clock registry agent jobs that declare allow:; docs/design/event-jobs.md section 3.2)
    shape: agent
    model_group: default
    purpose: "a scheduled agent job that declares allow: in the registry: the job's allow: rules and the platform's own
      settings for the project are its whole boundary, as for agent-job-event"
    # The same confinement as agent-job-event: dontAsk + only those rules; settings: platform = the project's
    # accumulated tool permissions and the user's are not loaded, nor the project's hooks (its notes are committed by
    # the hourly memory sync).
    permission_mode: dontAsk
    prompts: none
    allow_from_env: AGENT_JOB_ALLOW
    tool_servers: allowed_only
    settings: platform
    project_env: AGENT_JOB_PROJECT
    # the platform's mail tools only for a job that declares mail: true (registry), and only to start new letters
    # (docs/design/confined-mail-tools.md M1)
    mail: tools
    mail_from_env: AGENT_JOB_MAIL
    tier_from_env: AGENT_JOB_TIER
    timeout_s: 3600
    output: {format: text}
    on_failure: say_so      # the job fails, status page red
  agent-job-event:
    caller: bin/run-agent-job.sh (event-triggered registry jobs; docs/design/event-jobs.md)
    shape: agent
    model_group: default
    purpose: "an agent job started by bus events: anyone who can write the bus can start it with their text, so only
      the job's declared allow: rules and the platform's own settings for the project apply"
    # Unattended and always declared (registry validation): dontAsk + only those rules. settings: platform = the
    # project's accumulated tool permissions and the user's are not loaded (the runtime decides how); its sandbox and
    # deny list come from the platform's policy, not from what happens to be rendered in the workspace.
    permission_mode: dontAsk
    prompts: none
    allow_from_env: AGENT_JOB_ALLOW
    tool_servers: allowed_only
    settings: platform
    project_env: AGENT_JOB_PROJECT
    # no mail: any bus writer's text would send as the project (confined-mail-tools.md M1)
    mail: none
    prompt_source: untrusted
    tier_from_env: AGENT_JOB_TIER
    timeout_s: 3600
    output: {format: text}
    on_failure: say_so      # the run fails, its events wait for the next attempt
  login-check:
    caller: bin/check-claude-login.py
    shape: agent
    model_group: fast
    # don't load the environment's MCP (the global ones include production databases; turning tools off doesn't block
    # them, 10-27 experiment)
    extra_args: ["--strict-mcp-config"]
    purpose: "hourly check that claude's login still works (one minimal request each with the subscription login under launchd and the headless token); sends Discord when broken"
    auth: subscription            # for the token check the caller sets LLM_AUTH=token
    tools: ""
    timeout_s: 120
    output: {format: text}
    on_failure: say_so      # sends a Discord alert
  mailbox-escalation:
    caller: bin/hubbus (dispatch → run-agent-job.sh)
    shape: agent
    model_group: default
    purpose: "a request in a project mailbox nobody picked up (nobody is using the project, or it waited a few minutes): open a headless session in that project that only writes memory notes, replies, asks the owner"
    # Anyone who can write the bus can start it with their text: confined like agent-job-event (docs/design/
    # mailbox-routing.md, "11-02"). settings: platform = none of the project's saved permissions, the user's or the
    # project's hooks; dontAsk, so the rules below are the whole boundary. No shell: the mail is the platform's tools
    # (mail: tools, docs/design/confined-mail-tools.md), which act only as its project and on the letters it was started
    # for (MAILBOX_LETTERS, hubbus run_refusal; mailbox-session-first.md, "Triage"). It takes nothing: what it leaves
    # stays open for sessions.
    permission_mode: dontAsk
    prompts: none
    tools: Read,Edit,Write,Glob,Grep
    # Write is covered by the Edit rule (a new day's note file)
    allowed_tools: ["Edit(./.agent-memory/memory/**)"]
    tool_servers: allowed_only
    settings: platform
    project_env: MAILBOX_PROJECT
    mail: tools
    letters_env: MAILBOX_LETTERS
    prompt_source: untrusted
    timeout_s: 1800
    output: {format: text}
    on_failure: say_so      # the bridge reports the escalation failure
  mailbox-propose:
    caller: "bin/propose_apply.py (called by hubbus dispatch when hub.json mailbox.handler: propose)"
    shape: agent
    model_group: default
    purpose: "the propose version of mailbox requests: reads the project in a throwaway worktree and writes only memory notes; letters to send and closes go in the output and the platform sends them (any agent can run it)"
    # The write guarantee comes from the throwaway worktree + the platform adopting only .agent-memory/memory/**, not
    # from
    # the tool's permissions; no tool that runs commands is given: sending letters doesn't need it to run anything
    permission_mode: acceptEdits
    tools: Read,Edit,Write,Glob,Grep
    # the prompt comes from a letter any project can send, and a settings file the run loads can grant it reads past its folder
    # (real runs: docs/design/mailbox-session-first.md, step 3's record). A runtime that can't be told is held to the throwaway copy
    restricted: true
    extra_args: ["--strict-mcp-config"]
    output: {format: json, schema: llm/mailbox-propose.schema.json}
    timeout_s: 1800
    # nothing is applied, sent or closed; propose_apply records job.failed, holds the letter and asks the owner why
    on_failure: say_so
  mailbox-route:
    caller: "bin/hubbus (dispatch → bin/mailbox_route.py, in the background, through llm.answer)"
    shape: completion
    model_group: fast
    purpose: "a request or question with several live sessions of its project to go to and nothing in its thread to pick one: which session gets it (docs/design/mailbox-session-first.md, Picking one)"
    # Its input is a letter any project can send, a sandboxed one included: one request a call (max_attempts), a short
    # answer, and a schema with no enum or pattern, so an error can't echo a value. llm.answer prints and publishes
    # nothing, since a reason can quote the model: dispatch publishes the job.failed itself, with a fixed detail, once a day
    # per project
    tools: ""
    output: {format: json, schema: llm/mailbox-route.schema.json}
    max_tokens: 200
    max_attempts: 1
    timeout_s: 60
    # the model answers with a label (s1, s2…), never an id, which completion's mask would take; the platform takes only
    # a label of the candidates it listed; anything else, or no answer in two ticks, and the most recently active session
    # gets it
    on_failure: default
  mailbox-conversation:
    caller: bin/hubbus (dispatch → llm.py run, with runtime_claude.resume_args)
    shape: agent
    model_group: standard
    purpose: "a reply in a conversation reaches an idle session: continue in the background with its context (a branched copy, the original session untouched), only writing notes, replies, asking the owner"
    # Same confinement as mailbox-escalation (settings: platform, dontAsk, no shell: the mail is the platform's tools);
    # the original session's permission mode and saved permissions are not carried over (it may be acceptEdits/auto, with
    # rules a person approved while watching)
    permission_mode: dontAsk
    prompts: none
    tools: Read,Edit,Write,Glob,Grep
    allowed_tools: ["Edit(./.agent-memory/memory/**)"]
    settings: platform
    project_env: MAILBOX_PROJECT
    mail: tools
    letters_env: MAILBOX_LETTERS
    prompt_source: untrusted
    # a point with mail tools checks the run loads no server under the platform's own id (sealed below, so nothing is
    # asked: confined-mail-tools.md M2)
    tool_servers: allowed_only
    # don't load the project's MCP servers (e.g. the project's production database); the background copy doesn't need
    # them
    extra_args: ["--strict-mcp-config"]
    timeout_s: 1800
    output: {format: text}
    # a failure records job.failed; not closed after 35 minutes the letter is open again, and it is not forked twice
    on_failure: retry_later
  lease-session:
    caller: bin/lease-runner.py (llm.py exec)
    shape: agent
    model_group: standard
    purpose: "the discuss session of a channel lease: a long-running stream-json process where the owner discusses the project in depth through the assistant; read-only"
    # Only read tools; read rules are allowed (not sent to the relay); WebFetch to domains outside the registry and
    # AskUserQuestion go through the permission relay (sent to the phone)
    tools: Read,Glob,Grep,WebSearch,WebFetch,AskUserQuestion
    # show_file: shows the user a file from the project (docs/design/lease-show-file.md)
    allowed_tools: ["Read", "Glob", "Grep", "WebSearch", "mcp__lease_relay__show_file"]
    extra_allow_env: LEASE_ALLOW        # added by the runner: WebFetch(domain:…) for the registry's network domains
    stream: true
    output: {format: text}
    on_failure: say_so      # the runner sends a process_crashed event, visible on the phone
  lease-work:
    caller: bin/lease-runner.py (llm.py exec)
    shape: agent
    model_group: standard
    purpose: "the work session of a channel lease (phase two, idea sandboxes only): once the owner allows hands-on work, it may change this project's files and run commands, asking the owner first every time"
    # No permission_mode / prompts: writes must go through the permission relay (--permission-prompt-tool) to the phone;
    # dontAsk would refuse them before that.
    # Only reads are still allowed automatically; Edit/Write/Bash all go through lease-relay.py (refused outright
    # outside
    # the folder, otherwise the owner is asked).
    tools: Read,Glob,Grep,WebSearch,WebFetch,AskUserQuestion,Edit,Write,NotebookEdit,Bash
    allowed_tools: ["Read", "Glob", "Grep", "WebSearch", "mcp__lease_relay__show_file"]
    extra_allow_env: LEASE_ALLOW
    stream: true
    output: {format: text}
    on_failure: say_so     # the runner sends a process_crashed event, visible on the phone
  lease-handover:
    caller: bin/lease-runner.py
    shape: agent
    model_group: standard
    purpose: "on detaching a lease: resume the same session and write a structured handover (summary, decisions, open questions, what the owner has to do, memory notes)"
    tools: ""
    output: {format: json, schema: llm/lease-handover.schema.json}
    timeout_s: 600
    # the runner retries once, failing that it produces a minimal handover (fallback: true); the safe result is supplied
    # by the runner, not the registry
    on_failure: default
exempt: []
