# Maintenance specific to Claude Code (docs/design/tool-agnostic.md): login check, updating claude, headless token
# expiry. Turn it on only when Claude Code is the runtime (runtime.default: claude) or judgment points are handed to it;
# someone who doesn't use Claude leaves it off, so these jobs and credential checks don't exist and no alert arrives for
# "no Claude token".
v: 1
name: claude
type: module
description: "Claude Code login check, updates, headless token expiry reminders"
jobs:
# do claude's three logins (launchd subscription login, headless token, the .credentials.json used over SSH) still work;
# alerts when broken/about to expire
- name: claude-login
  legacy_name: agent-hub/claude-login
  every: 1h
  run: bin/py bin/check-claude-login.py
# updates the claude under the nvm default version to the latest (schedules/leases/the assistant use this one; Desktop
# sessions use their own); if the install fails, reinstalls the old version and fails
- name: update-claude
  legacy_name: agent-hub/update-claude
  at: "01:15"
  max_attempts_per_day: 2
  run: bin/py bin/update-claude.py
secrets:
- name: claude-headless-token
  path: ~/.claude/headless-oauth-token
  max_age_days: 365
  warn_days: 30
  backup: false
  why: "claude setup-token 產生(llm.py 預設的憑證);丟了重跑就有新的,不用備份"
  rotate: "跑 claude setup-token,把新的 token 寫進 ~/.claude/headless-oauth-token(chmod 600)"
