# 回頭清理(bin/consolidate-memory.py):超過 14 天的 memory 日期檔整理進 reference/、修正被推翻的敘述。
# opus、一晚最多 3 個專案、每個專案最多一週一次,沒有夠舊的日期檔就零 LLM 跳過。背景跑;用 before: 排在 librarian 前面,
# librarian 拿到的是整理過的副本。腳本 30 分鐘後不開新專案、單次呼叫上限 20 分鐘。失敗不重試(LLM job)。
v: 1
name: consolidate
type: module
description: 每晚把超過 14 天的 memory 日期檔整理進 reference/(在 librarian 之前)
jobs:
- name: consolidate-memory
  legacy_name: agent-hub/consolidate-memory
  at: "02:00"
  background: true
  max_attempts_per_day: 1
  before: [agent-hub/librarian]
  run: bin/consolidate-memory.py
