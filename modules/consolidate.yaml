# Looking back (bin/consolidate-memory.py): folds memory date files older than 14 days into reference/ and corrects
# statements that were overturned. opus, at most 3 projects a night and each project at most once a week; with no date
# files old enough it skips with zero LLM. Runs in the background; before: puts it ahead of the librarian, so the
# librarian gets the consolidated copy. After 30 minutes the script starts no new project; a single call is capped at
# 20 minutes. No retry on failure (LLM job).
v: 1
name: consolidate
type: module
description: "Nightly: folds memory date files older than 14 days into reference/ (before the librarian)"
needs_llm: true   # its one step is the consolidate judgment point
jobs:
- name: consolidate-memory
  legacy_name: agent-hub/consolidate-memory
  at: "02:00"
  background: true
  max_attempts_per_day: 1
  before: [agent-hub/librarian]
  run: bin/py bin/consolidate-memory.py
