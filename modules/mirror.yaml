# Read-only --mirror clones of GitHub repos (mirror-list.txt), purely for disaster recovery, zero LLM.
v: 1
name: mirror
type: module
description: "Nightly: updates the --mirror clone of every repo in mirror-list.txt"
jobs:
- name: mirror-backup
  legacy_name: agent-hub/mirror-backup
  at: "04:00"
  run: bin/mirror-backup.sh
