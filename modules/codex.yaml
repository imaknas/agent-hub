# Codex (docs/design/newcomer-path.md B4). What works today: its sessions reach the mailbox through brunna's MCP server
# (docs/mcp.md, registered by init), and the weekly statistics read its session files. The platform's own work doesn't run
# on Codex yet: the command template (bin/runtime_command.py) can't be held to a judgment point's limits, so it runs only
# mailbox-propose in the platform's throwaway worktree, and never as runtime.default (config check refuses it;
# docs/design/runtime-codex.md, step 0). So the preset leaves runtime.default at none and keeps the template, for pinning
# mailbox-propose on it beside a default with session state; brunna's decisions need an LLM provider meanwhile (init offers
# brunna llm setup). Its own runtime (bin/runtime_codex.py, docs/design/runtime-codex.md step 1) is the next step: session
# hooks, its login, confined runs.
# `agenthub init` offers it in its agent step and turns this module on when it is picked.
v: 1
name: codex
type: module
description: "your Codex chats reach the mailbox by asking brunna's tools (no letters shown in the chat by themselves yet); brunna's own background work and decisions don't run on Codex yet (they need an LLM provider meanwhile)"
runtime_preset:
  label: Codex
  find: codex
  install:
  - '[ -s "$HOME/.nvm/nvm.sh" ] || curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash'
  - '. "$HOME/.nvm/nvm.sh" && nvm install --lts && nvm alias default "lts/*" && npm install -g @openai/codex'
  credential:
    kind: tool-login
    command: [codex, login]
    status: [codex, login, status]
  # global in ~/.codex/config.toml, shared with the Codex (ChatGPT) desktop app
  mcp_register: [codex, mcp, add, "{server}", --, "{cli}", mcp]
  # agenthub uninstall
  mcp_unregister: [codex, mcp, remove, "{server}"]
  settings:
    runtime:
      # not command: it can't be held to a point's limits, so it is no default (docs/design/runtime-codex.md, step 0)
      default: none
      command:
        run: [codex, exec, --sandbox, workspace-write, --skip-git-repo-check, --ephemeral, --color, never,
              -o, "{output_file}", "-"]
        output_file: true
    modules:
      codex: true
