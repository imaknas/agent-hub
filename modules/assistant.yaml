# The personal assistant (hub.json assistant; an optional tool, docs/design/tool-agnostic.md): reconciling questions to
# the owner, and channel leases that let the assistant lend its conversation to a project session. A deployment without
# an assistant leaves this module off (the owner side uses the built-in owner module).
# The owner to-do registrar moved back to the core on 10-29 (registrar in projects/agent-hub.yaml): it runs whoever
# the owner side is.
# The letters reconcile-questions sends are dispatched right away by the mailbox dispatch; it runs only once at night,
# don't make it an interval job.
v: 1
name: assistant
type: module
description: "Personal assistant: question reconciliation, channel leases"
requires_config: [assistant.api]
jobs:
- name: reconcile-questions
  legacy_name: agent-hub/reconcile-questions
  at: "03:00"
  after: [agent-hub/librarian]
  max_attempts_per_day: 1
  run: bin/py bin/hubbus reconcile-questions
# whether the assistant's pushes still reach the owner's phone (it can't say so itself when they don't)
- name: push-reach
  every: 1h
  run: bin/py bin/check-push-reach.py
services:
# channel leases (bin/lease-runner.py): 127.0.0.1:18797, Bearer token in .secrets/runner-token
- name: lease-runner
  label: local.brunna.lease-runner
  run: bin/py bin/lease-runner.py
  keepalive: true
  throttle_s: 10
  env: {PATH: "$PLATFORM_PATH"}   # the nvm default version (claude) + Homebrew, see hubconf.LAUNCHD_PATH
secrets:   # checked only when this module is on (check-secrets.py)
- {name: lease-runner-token, path: .secrets/runner-token, why: "the Bearer token of channel leases; if it is gone the runner makes a new one, and the assistant has to switch to it"}
# formats the assistant defines (copies under contracts/vendor/); not compared when this module is off
# (contracts-check.py)
consumes:
- {contract: muninn-handoffs, v: 1, copy: contracts/vendor/muninn/handoffs.v1.schema.json, from: muninn}
- {contract: muninn-digests, v: 1, copy: contracts/vendor/muninn/digests.v1.schema.json, from: muninn}
- {contract: muninn-messages, v: 1, copy: contracts/vendor/muninn/messages.v1.schema.json, from: muninn}
- {contract: muninn-platform-alerts, v: 1, copy: contracts/vendor/muninn/platform-alerts.v1.md, from: muninn}
- {contract: muninn-permission-requests, v: 2, copy: contracts/vendor/muninn/permission-requests.v2.schema.json, from: muninn}
