# Weekly review (bin/weekly-reflect.sh): the previous week's cross-project activity statistics + one model call (only
# the statistics are sent).
v: 1
name: reflect
type: module
description: "Every Monday: the previous week's cross-project review (reflect/)"
# the job always asks the reflect-week judgment point for the analysis, and the statistics come from transcripts,
# which only a coding agent has
needs_llm: true
jobs:
- name: weekly-reflect
  legacy_name: agent-hub/weekly-reflect
  at: "07:00"
  days: [mon]
  catch_up: period   # asleep or off that day: runs when the machine wakes
  max_attempts_per_day: 2
  run: bin/weekly-reflect.sh
