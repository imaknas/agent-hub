# 第二階段強制的「能力」:sandbox 擋住的程式用 bin/hub-run --cap <能力> 交給平台代跑(docs/design/capabilities.md)。
# 登錄的 enforce 欄位驗證、render-settings(寫 sandbox 設定)留在核心:沒開模組也要讀得到登錄、關掉 enforce 也要能退回。
v: 1
name: sandbox
type: module
description: "Platform-run capabilities (cap-runner): sandboxed projects borrow a capability with hub-run --cap"
services:
- name: cap-runner               # bin/cap-runner.py:用平台的 Seatbelt profile 執行 hub-run 放的請求
  label: local.agent-hub.cap-runner
  run: bin/py bin/cap-runner.py
  keepalive: true
  throttle_s: 10
