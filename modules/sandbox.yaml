# "Capabilities" for phase-two enforcement: a program the sandbox blocks is handed to the platform runner with
# bin/hub-run --cap <capability> (docs/design/capabilities.md).
# Validating the registry's enforce field and render-settings (writes the sandbox settings) stay in the core: the
# registry must be readable without the module, and turning enforce off must be able to revert.
v: 1
name: sandbox
type: module
description: "Platform-run capabilities (cap-runner): sandboxed projects borrow a capability with brunna cap-run --cap"
services:
# bin/cap-runner.py: runs the requests hub-run drops off under the platform's Seatbelt profile
- name: cap-runner
  label: local.brunna.cap-runner
  run: bin/py bin/cap-runner.py
  keepalive: true
  throttle_s: 10
