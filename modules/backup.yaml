# Encrypted cloud backup (restic, bin/backup.py; settings in hub.json backup, password/keys in .secrets/).
v: 1
name: backup
type: module
description: "Nightly encrypted cloud backup + monthly restore test"
requires_config: [backup.repo]
jobs:
- name: backup
  legacy_name: agent-hub/backup
  at: "05:45"
  background: true
  max_attempts_per_day: 2
  run: bin/py bin/backup.py run
# monthly restore test: restore into a temporary directory, check SQLite/bundles/files, spot-check 10% of the data
- name: backup-verify
  legacy_name: agent-hub/backup-verify
  at: "06:30"
  days_of_month: [1]
  after: [backup]
  background: true
  max_attempts_per_day: 1
  run: bin/py bin/backup.py verify
secrets:   # checked only when this module is on (check-secrets.py)
- {name: b2-key, path: .secrets/b2-env, rotate: "Backblaze 後台重發 application key,寫進 .secrets/b2-env"}
- {name: backup-password, path: .secrets/backup-password, why: "restic 密碼;還原要靠 owner 自己另外存的那一份(例:密碼管理器;備份裡這份解不開自己)"}
