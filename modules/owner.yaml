# The built-in minimal owner side (bin/owner.py; docs/design/tool-agnostic.md, "the owner side can be swapped"): for
# people
# without a personal assistant. New to-dos and questions for the owner are notified through the hub.json alerts
# channels;
# close and answer with `agenthub owner …`.
# A deployment with an assistant (owner_side: assistant) leaves this module off: two principal sides would fight.
v: 1
name: owner
type: module
description: "Built-in owner side: notices of new to-dos and questions (close and answer with agenthub owner)"
jobs:
- name: notify
  every: 1h
  run: bin/py bin/owner.py notify
