# 專案登錄(schema v1,見 bin/registry.py);直接改這個檔
# consolidate-memory:把超過 14 天的 memory 日期檔整理進 reference/、修正被推翻的敘述(opus,一晚最多 3 個
#   專案、每個專案最多一週一次,沒有夠舊的日期檔就零 LLM 跳過)。背景跑;librarian 用 after: 等它跑完,拿到的是
#   整理過的副本。腳本 30 分鐘後不開新專案、單次呼叫上限 20 分鐘,正常約 02:50 前結束。失敗不重試(LLM job)。
# background: true = 在背景跑,不擋後面的 job;超過幾分鐘的 job 都要加。
# hubbus-bridge:Muninn 的轉交收進各專案信箱、給 owner 的信跟轉交的 done 送進 Muninn、太久沒人收的信交給
#   headless agent、清掉 60 天前結案的。短、冪等、零 LLM(升級時才會開 claude -p)。
v: 1
name: agent-hub
memory: false
push_on_merge: false
jobs:
- name: consolidate-memory
  legacy_name: consolidate-memory
  at: 02:00
  background: true
  max_attempts_per_day: 1
  run: bin/consolidate-memory.py
  cwd: hub
- name: librarian
  legacy_name: librarian
  at: 03:00
  background: true
  after:
  - consolidate-memory
  run: bin/librarian.sh
  cwd: hub
- name: mirror-backup
  legacy_name: mirror-backup
  at: 04:00
  run: bin/mirror-backup.sh
  cwd: hub
- name: weekly-reflect
  legacy_name: weekly-reflect
  at: 07:00
  days:
  - mon
  max_attempts_per_day: 2
  run: bin/weekly-reflect.sh
  cwd: hub
- name: hubbus-bridge
  legacy_name: hubbus-bridge
  every: 15m
  run: /usr/bin/python3 bin/hubbus bridge
  cwd: hub
- name: render-services
  every: 15m
  cwd: hub
  run: /opt/homebrew/bin/python3 bin/render-services.py
- name: render-settings          # 第二階段:登錄 enforce.sandbox 的專案 → sandbox + 權限規則;偏移就寫回並失敗(狀態頁紅)
  every: 15m
  cwd: hub
  run: /opt/homebrew/bin/python3 bin/render-project-settings.py
- name: registry-updates         # 專案寄來的 manifest.update 信:驗證後套用或退回(零 LLM)
  every: 15m
  cwd: hub
  run: /opt/homebrew/bin/python3 bin/registry.py apply-updates
- name: update-claude            # nvm 預設版本底下的 claude 更新到最新(排程/租借/Muninn 用這份;Desktop 的 session 用自己的);裝不起來就裝回舊版、失敗
  at: "01:15"
  cwd: hub
  max_attempts_per_day: 2
  run: /opt/homebrew/bin/python3 bin/update-claude.py
- name: backup                   # 加密雲端備份(restic → B2,bin/backup.py;設定在 hub.json backup)
  at: "05:45"
  cwd: hub
  background: true
  max_attempts_per_day: 2
  run: /opt/homebrew/bin/python3 bin/backup.py run
- name: backup-verify            # 每月還原測試:還原到暫存目錄、檢查 SQLite/bundle/檔案、10% 資料抽查
  at: "06:30"
  days_of_month: [1]
  after: [backup]
  cwd: hub
  background: true
  max_attempts_per_day: 1
  run: /opt/homebrew/bin/python3 bin/backup.py verify
- name: contracts-check          # 契約副本 == 原版(兩個方向)+ 實際資料照契約;不一致發 job.failed
  at: "01:30"
  cwd: hub
  max_attempts_per_day: 1
  run: /opt/homebrew/bin/python3 bin/contracts-check.py --quiet
provides:
- {contract: lease-runner, v: 1, schema: contracts/lease-runner.v1.schema.json}
- {contract: lease-handover, v: 1, schema: contracts/lease-handover.v1.schema.json}
- {contract: hubbus, v: 1, schema: contracts/hubbus.v1.schema.json}
- {contract: todo-md, v: 1, schema: contracts/todo-md.v1.md}
- {contract: state-todo, v: 1, schema: contracts/state-todo.v1.md}
- {contract: reflect-week, v: 1, schema: contracts/reflect-week.v1.schema.json}
- {contract: project, v: 1, schema: contracts/project.v1.schema.json}
consumes:
- {contract: muninn-handoffs, v: 1, copy: contracts/vendor/muninn/handoffs.v1.schema.json, from: muninn}
- {contract: muninn-digests, v: 1, copy: contracts/vendor/muninn/digests.v1.schema.json, from: muninn}
- {contract: muninn-messages, v: 1, copy: contracts/vendor/muninn/messages.v1.schema.json, from: muninn}
- {contract: muninn-permission-requests, v: 1, copy: contracts/vendor/muninn/permission-requests.v1.schema.json, from: muninn}
services:
- name: lease-runner             # 通道租借(bin/lease-runner.py):127.0.0.1:18797,Bearer token 在 .secrets/runner-token
  label: local.agent-hub.lease-runner
  cwd: hub
  run: /opt/homebrew/bin/python3 bin/lease-runner.py
  keepalive: true
  throttle_s: 10
  env: {PATH: "$PLATFORM_PATH"}   # nvm 預設版本(claude)+ Homebrew,見 hubconf.LAUNCHD_PATH
