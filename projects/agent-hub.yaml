# Project registry entry (schema v1, see bin/registry.py); edit this file directly
# background: true = runs in the background without holding up the jobs after it; every job longer than a few minutes
#   needs it.
# hubbus-bridge: brings the assistant's handoffs into each project's mailbox, sends letters for the owner and done for
#   handoffs to the assistant, hands letters nobody picked up for too long to a headless agent, clears those closed more
#   than 60 days ago. Short, idempotent, zero LLM (only an escalation opens claude -p).
v: 1
name: agent-hub
memory: false
push_on_merge: false
commits: conventional          # commit titles (bin/commit_title.py; this repo also has githooks/commit-msg)
jobs:
- name: librarian
  legacy_name: librarian
  at: 03:00
  background: true
  # replaced librarian.sh on 10-27 (the behavior test tests/test_librarian_flow.py ran against both)
  run: bin/py bin/librarian.py
  cwd: hub
# The mechanical steps after the librarian (zero LLM), formerly hard-coded at the end of librarian.sh, are now each a
# job of their own (docs/design/new-user.md step 0): each re-runs on its own and shows its own result on the status
# page. The ones specific to the personal assistant (reconcile-questions, channel leases) are in modules/assistant.yaml;
# without that module these still run. consolidate-memory, mirror-backup, weekly-reflect and backup are in modules/
# too.
# the requester side of Principal Handoff 0.3: the owner's to-dos → raised records; settled ones applied by key.
- name: registrar
  # moved back from the assistant module to the core on 10-29: runs whether the owner side is the assistant or the
  # built-in one (tool-agnostic.md)
  legacy_name: assistant/knas-tasks
  at: 03:00
  after:
  - librarian
  before:                        # todo.md must reflect what was applied (todo and publish come after it)
  - todo
  - librarian-publish
  max_attempts_per_day: 3
  run: bin/py bin/registrar.py
  cwd: hub
# the cross-project to-do list todo.md (from each project's STATE.md to-do section, generated mechanically)
- name: todo
  at: 03:00
  after:
  - librarian
  max_attempts_per_day: 3
  run: bin/py bin/gen-todo.py   # writes todo.md in the data directory (hubconf.data_file)
  cwd: hub
# projects with conversations but no memory notes → a fixed block in todo.md + today's digest; todo regenerates the
# whole file, so this comes after it
- name: memory-gaps
  at: 03:00
  after:
  - todo
  max_attempts_per_day: 3
  run: bin/py bin/check-memory-gaps.py --apply
  cwd: hub
# STATE.md statements whose code anchor no longer resolves on the project's main → a fixed block in todo.md + today's
# digest (docs/design/state-anchors.md); reads the STATE.md the librarian just wrote, and todo regenerates the file
- name: state-anchors
  at: 03:00
  after:
  - librarian
  - todo
  max_attempts_per_day: 3
  run: bin/py bin/check-state-anchors.py --apply
  cwd: hub
# regenerates the roster in index.md, commits today's digest, index.md, review-log.md, todo.md
- name: librarian-publish
  at: 03:00
  after:
  - librarian
  - todo
  - memory-gaps
  - state-anchors
  max_attempts_per_day: 3
  run: bin/librarian-publish.sh
  cwd: hub
- name: hubbus-bridge
  legacy_name: hubbus-bridge
  every: 15m
  run: bin/py bin/hubbus bridge
  cwd: hub
- name: render-services
  every: 15m
  cwd: hub
  run: bin/py bin/render-services.py
# phase two: projects with enforce.sandbox in the registry → sandbox + permission rules; drift is written back and the
# job fails (status page red)
- name: render-settings
  every: 15m
  cwd: hub
  run: bin/py bin/render-project-settings.py
- name: registry-updates         # manifest.update letters from projects: validated, then applied or returned (zero LLM)
  every: 15m
  cwd: hub
  run: bin/py bin/registry.py apply-updates
# the credentials declared in the registry (each project's secrets:): present, backed up, about to expire; values are
# not read. Sends Discord on problems
- name: secrets
  at: "08:00"
  cwd: hub
  max_attempts_per_day: 2
  run: bin/py bin/check-secrets.py
# merged, clean worktrees: idle ≥ 2 days, delete rebuildable dependencies; removed only at ≥ 14 days with nobody using
# them (branch kept)
- name: prune-worktrees
  at: "04:30"
  cwd: hub
  max_attempts_per_day: 1
  run: bin/py bin/prune-worktrees --auto
# contract copies == originals (both directions) + real data follows the contracts; a mismatch sends job.failed
- name: contracts-check
  at: "01:30"
  cwd: hub
  max_attempts_per_day: 1
  run: bin/py bin/contracts-check.py --quiet
provides:
# runtime-independent; v1 was deleted on 10-25 once the assistant had switched (contracts/retired/)
- {contract: lease-runner, v: 2, schema: contracts/lease-runner.v2.schema.json}
- {contract: lease-handover, v: 1, schema: contracts/lease-handover.v1.schema.json}
- {contract: hubbus, v: 1, schema: contracts/hubbus.v1.schema.json}
# v2 = v1 + the English token set; v1 stays until every reader (the assistant) reads v2
- {contract: todo-md, v: 1, schema: contracts/todo-md.v1.md}
- {contract: todo-md, v: 2, schema: contracts/todo-md.v2.md}
- {contract: state-todo, v: 1, schema: contracts/state-todo.v1.md}
- {contract: state-todo, v: 2, schema: contracts/state-todo.v2.md}
# v2 = fixed English values for the analysis's classifications (v1: zh-Hant words); v1 stays until the assistant reads v2
- {contract: reflect-week, v: 1, schema: contracts/reflect-week.v1.schema.json}
- {contract: reflect-week, v: 2, schema: contracts/reflect-week.v2.schema.json}
- {contract: project, v: 1, schema: contracts/project.v1.schema.json}
- {contract: llm-points, v: 1, schema: contracts/llm-points.v1.schema.json}
# reading the assistant's contracts is declared in the consumes of modules/assistant.yaml (not compared when the
# assistant module is off)
services:
# The platform's own three long-running/periodic programs (lease-runner is in modules/assistant.yaml, cap-runner in
# modules/sandbox.yaml): formerly plists under launchd/ with /Users/<you> hard-coded, since 10-26 generated by
# render-services like the projects' services (paths from hubconf). The scheduler and the watchdog are deliberately not
# here: render-services is a job the scheduler runs, and a broken scheduler is exactly what the watchdog has to report
# (those two are installed by bin/hub init, docs/design/new-user.md 3.3).
# requests/questions nobody picks up are handled by the platform (hubbus dispatch, every minute;
# docs/design/mailbox-routing.md)
- name: mailbox-dispatch
  label: local.agent-hub-mailbox-dispatch
  cwd: hub
  run: bin/py bin/hubbus dispatch
  interval_s: 60
  # dispatch opens headless agents (claude, git); sbin kept as in the old plist
  env: {PATH: "$PLATFORM_PATH:/usr/sbin:/sbin"}
# the schedule status page (.state/status produced by gen-status-page.py, opened to the tailnet with tailscale serve)
- name: status-page
  label: local.status-page
  cwd: hub
  run: bin/py -m http.server 18790 --bind 127.0.0.1 --directory .state/status
  keepalive: true
  log: .logs/status-page.log
# hourly catch-up commit + push of every project's .agent-memory (the safety net for the SessionEnd hook)
- name: sync-all-memory
  label: local.sync-all-memory-mini
  cwd: hub
  run: bin/sync-all-memory.sh
  interval_s: 3600

# Machine-level credentials (managed by the platform) are not listed here: each feature that uses one declares it (the
# backup's in modules/backup.yaml, channel leases' in modules/assistant.yaml, Claude Code's in modules/claude.yaml); the
# keys for alerts (hub.json alerts) and LLM providers (hub.json llm) are derived from the settings by check-secrets.py.
# Features that are off are not checked (a new user is not asked for a pile of credentials they don't use)
