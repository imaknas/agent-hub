# 專案登錄(schema v1,見 bin/registry.py);直接改這個檔
# background: true = 在背景跑,不擋後面的 job;超過幾分鐘的 job 都要加。
# hubbus-bridge:Muninn 的轉交收進各專案信箱、給 owner 的信跟轉交的 done 送進 Muninn、太久沒人收的信交給
#   headless agent、清掉 60 天前結案的。短、冪等、零 LLM(升級時才會開 claude -p)。
v: 1
name: agent-hub
memory: false
push_on_merge: false
jobs:
- name: librarian
  legacy_name: librarian
  at: 03:00
  background: true
  run: bin/py bin/librarian.py   # 10-27 換掉 librarian.sh(行為測試 tests/test_librarian_flow.py 兩支都跑過)
  cwd: hub
# librarian 之後的機械步驟(零 LLM),以前寫死在 librarian.sh 的最後,現在各自是一個 job(docs/design/new-user.md 第 0 步):
# 各自重跑、各自在狀態頁顯示成敗。個人助理的(knas-tasks、reconcile-questions)在 modules/assistant.yaml,用 before:
# 把自己插進這條流程;沒開那個模組時這裡照樣跑。consolidate-memory、mirror-backup、weekly-reflect、backup 也在 modules/。
- name: todo                     # 跨專案待辦清單 todo.md(各專案 STATE.md 的 ## 待辦,機械產生)
  at: 03:00
  after:
  - librarian
  max_attempts_per_day: 3
  run: bin/py bin/gen-todo.py   # 寫到 data 目錄的 todo.md(hubconf.data_file)
  cwd: hub
- name: memory-gaps              # 有對話但沒記 memory 的專案 → todo.md 的固定區塊 + 今天的 digest;todo 會整份重生,所以排在它後面
  at: 03:00
  after:
  - todo
  max_attempts_per_day: 3
  run: bin/py bin/check-memory-gaps.py --apply
  cwd: hub
- name: librarian-publish        # 重生 index.md 的名冊,commit 今天的 digest、index.md、review-log.md、todo.md
  at: 03:00
  after:
  - librarian
  - todo
  - memory-gaps
  max_attempts_per_day: 3
  run: bin/librarian-publish.sh
  cwd: hub
- name: hubbus-bridge
  legacy_name: hubbus-bridge
  every: 15m
  run: bin/py bin/hubbus bridge
  cwd: hub
- name: render-services
  every: 15m
  cwd: hub
  run: bin/py bin/render-services.py
- name: render-settings          # 第二階段:登錄 enforce.sandbox 的專案 → sandbox + 權限規則;偏移就寫回並失敗(狀態頁紅)
  every: 15m
  cwd: hub
  run: bin/py bin/render-project-settings.py
- name: registry-updates         # 專案寄來的 manifest.update 信:驗證後套用或退回(零 LLM)
  every: 15m
  cwd: hub
  run: bin/py bin/registry.py apply-updates
- name: secrets                  # 登錄宣告的憑證(各專案的 secrets:)在不在、有沒有被備份、快不快到期;不讀值。有問題發 Discord
  at: "08:00"
  cwd: hub
  max_attempts_per_day: 2
  run: bin/py bin/check-secrets.py
- name: prune-worktrees           # 已合併、乾淨的 worktree:閒置 ≥ 2 天刪重建得回來的依賴、≥ 14 天且沒人在用才移除(branch 留著)
  at: "04:30"
  cwd: hub
  max_attempts_per_day: 1
  run: bin/py bin/prune-worktrees --auto
- name: contracts-check          # 契約副本 == 原版(兩個方向)+ 實際資料照契約;不一致發 job.failed
  at: "01:30"
  cwd: hub
  max_attempts_per_day: 1
  run: bin/py bin/contracts-check.py --quiet
provides:
- {contract: lease-runner, v: 2, schema: contracts/lease-runner.v2.schema.json}   # 跟執行環境無關;v1 10-25 Muninn 換好後刪了(contracts/retired/)
- {contract: lease-handover, v: 1, schema: contracts/lease-handover.v1.schema.json}
- {contract: hubbus, v: 1, schema: contracts/hubbus.v1.schema.json}
- {contract: todo-md, v: 1, schema: contracts/todo-md.v1.md}
- {contract: state-todo, v: 1, schema: contracts/state-todo.v1.md}
- {contract: reflect-week, v: 1, schema: contracts/reflect-week.v1.schema.json}
- {contract: project, v: 1, schema: contracts/project.v1.schema.json}
- {contract: llm-points, v: 1, schema: contracts/llm-points.v1.schema.json}
consumes:
- {contract: muninn-handoffs, v: 1, copy: contracts/vendor/muninn/handoffs.v1.schema.json, from: muninn}
- {contract: muninn-digests, v: 1, copy: contracts/vendor/muninn/digests.v1.schema.json, from: muninn}
- {contract: muninn-messages, v: 1, copy: contracts/vendor/muninn/messages.v1.schema.json, from: muninn}
- {contract: muninn-permission-requests, v: 2, copy: contracts/vendor/muninn/permission-requests.v2.schema.json, from: muninn}
services:
# 平台自己的三個常駐/定時程式(lease-runner 在 modules/assistant.yaml、cap-runner 在 modules/sandbox.yaml):以前是 launchd/ 底下寫死 /Users/<you> 的 plist,10-26 起跟專案的服務一樣由 render-services 產生
# (路徑從 hubconf)。排程器跟看門狗刻意不在這裡:render-services 是排程器跑的 job,而排程器壞了正是看門狗要報的事
# (那兩份由 bin/hub init 裝,docs/design/new-user.md 3.3)。
- name: mailbox-dispatch          # 沒人收的 request/question 由平台處理(hubbus dispatch,每分鐘;docs/design/mailbox-routing.md)
  label: local.agent-hub-mailbox-dispatch
  cwd: hub
  run: bin/py bin/hubbus dispatch
  interval_s: 60
  env: {PATH: "$PLATFORM_PATH:/usr/sbin:/sbin"}   # dispatch 會開 headless agent(claude、git);sbin 照舊 plist 留著
- name: status-page               # 排程狀態頁(gen-status-page.py 產生的 .state/status,tailscale serve 對 tailnet 開)
  label: local.status-page
  cwd: hub
  run: bin/py -m http.server 18790 --bind 127.0.0.1 --directory .state/status
  keepalive: true
  log: .logs/status-page.log
- name: sync-all-memory           # 每小時對所有專案的 .agent-memory 補 commit + push(SessionEnd hook 的安全網)
  label: local.sync-all-memory-mini
  cwd: hub
  run: bin/sync-all-memory.sh
  interval_s: 3600

# 機器層級的憑證(平台管):只寫名稱、位置、到期,不寫值。check-secrets.py 每天檢查(在不在、備份、到期)
secrets:
- {name: discord-bot-token, path: .secrets/discord-token, why: "警報用的 Discord bot(看門狗、render-services、claude-login、secrets)"}
- {name: b2-key, path: .secrets/b2-env, rotate: "Backblaze 後台重發 application key,寫進 .secrets/b2-env"}
- {name: backup-password, path: .secrets/backup-password, why: "restic 密碼;還原要靠 Knas 密碼管理器裡那一份(備份裡這份解不開自己)"}
- {name: lease-runner-token, path: .secrets/runner-token, why: "通道租借的 Bearer token;不見了 runner 會重產,Muninn 要跟著換"}
