<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 262" role="img" aria-label="agent-hub 怎麼運作:agent 記下工作，每晚整理，只有你能決定的事回到你手上，你的回答讓工作接著做下去"><title>agent-hub 怎麼運作:agent 記下工作，每晚整理，只有你能決定的事回到你手上，你的回答讓工作接著做下去</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#818cf8"/></marker></defs><g font-family="&#x27;PingFang TC&#x27;, &#x27;Noto Sans TC&#x27;, &#x27;Microsoft JhengHei&#x27;, ui-sans-serif, sans-serif"><rect x="10" y="12" width="230" height="160" rx="16" fill="#111827" stroke="#374151" stroke-width="2"/><circle cx="40" cy="44" r="15" fill="#818cf8"/><text x="40" y="50" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">1</text><text x="64" y="51" font-size="18" font-weight="700" fill="#e5e7eb">你的 agent 做事</text><text x="28" y="92" font-size="14.5" fill="#9ca3af">在每個專案裡,Claude Code</text><text x="28" y="116" font-size="14.5" fill="#9ca3af">或 Codex 把做了什麼、</text><text x="28" y="140" font-size="14.5" fill="#9ca3af">學到什麼記下來。</text><line x1="244" y1="92.0" x2="274" y2="92.0" stroke="#818cf8" stroke-width="3" marker-end="url(#a)"/><rect x="280" y="12" width="230" height="160" rx="16" fill="#111827" stroke="#374151" stroke-width="2"/><circle cx="310" cy="44" r="15" fill="#818cf8"/><text x="310" y="50" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">2</text><text x="334" y="51" font-size="18" font-weight="700" fill="#e5e7eb">每天晚上</text><text x="298" y="92" font-size="14.5" fill="#9ca3af">agent-hub 把筆記整理進</text><text x="298" y="116" font-size="14.5" fill="#9ca3af">每個專案的現況，再寫一份</text><text x="298" y="140" font-size="14.5" fill="#9ca3af">跨專案的摘要。</text><line x1="514" y1="92.0" x2="544" y2="92.0" stroke="#818cf8" stroke-width="3" marker-end="url(#a)"/><rect x="550" y="12" width="230" height="160" rx="16" fill="#111827" stroke="#374151" stroke-width="2"/><circle cx="580" cy="44" r="15" fill="#818cf8"/><text x="580" y="50" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">3</text><text x="604" y="51" font-size="18" font-weight="700" fill="#e5e7eb">回到你手上</text><text x="568" y="92" font-size="14.5" fill="#9ca3af">只有你能決定的事，變成</text><text x="568" y="116" font-size="14.5" fill="#9ca3af">一份待辦和問題清單。</text><text x="568" y="140" font-size="14.5" fill="#9ca3af"></text><line x1="784" y1="92.0" x2="814" y2="92.0" stroke="#818cf8" stroke-width="3" marker-end="url(#a)"/><rect x="820" y="12" width="230" height="160" rx="16" fill="#111827" stroke="#374151" stroke-width="2"/><circle cx="850" cy="44" r="15" fill="#818cf8"/><text x="850" y="50" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">4</text><text x="874" y="51" font-size="18" font-weight="700" fill="#e5e7eb">你來決定</text><text x="838" y="92" font-size="14.5" fill="#9ca3af">你的回答送回專案，下一個</text><text x="838" y="116" font-size="14.5" fill="#9ca3af">session(不管哪個工具)</text><text x="838" y="140" font-size="14.5" fill="#9ca3af">接著做。</text><path d="M935.0,176 V222 H125.0 V182" fill="none" stroke="#818cf8" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#a)"/><rect x="280.0" y="208" width="500" height="28" rx="14" fill="#1e1b4b"/><text x="530.0" y="227" text-anchor="middle" font-size="15" fill="#e5e7eb">下一個 session 從已知的狀態開始，不用從零來過</text></g></svg>
