<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 262" role="img" aria-label="How agent-hub works: agents note their work, agent-hub settles it nightly, what only you can decide comes back to you, and your answer carries the work on"><title>How agent-hub works: agents note their work, agent-hub settles it nightly, what only you can decide comes back to you, and your answer carries the work on</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker></defs><g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif"><rect x="10" y="12" width="230" height="160" rx="16" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/><circle cx="40" cy="44" r="15" fill="#4f46e5"/><text x="40" y="50" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">1</text><text x="64" y="51" font-size="18" font-weight="700" fill="#1f2937">Your agents work</text><text x="28" y="92" font-size="14.5" fill="#4b5563">In each project, Claude Code</text><text x="28" y="116" font-size="14.5" fill="#4b5563">or Codex notes what it did</text><text x="28" y="140" font-size="14.5" fill="#4b5563">and what it learned.</text><line x1="244" y1="92.0" x2="274" y2="92.0" stroke="#4f46e5" stroke-width="3" marker-end="url(#a)"/><rect x="280" y="12" width="230" height="160" rx="16" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/><circle cx="310" cy="44" r="15" fill="#4f46e5"/><text x="310" y="50" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">2</text><text x="334" y="51" font-size="18" font-weight="700" fill="#1f2937">Every night</text><text x="298" y="92" font-size="14.5" fill="#4b5563">agent-hub settles the notes</text><text x="298" y="116" font-size="14.5" fill="#4b5563">into each project&#x27;s state and</text><text x="298" y="140" font-size="14.5" fill="#4b5563">a digest across projects.</text><line x1="514" y1="92.0" x2="544" y2="92.0" stroke="#4f46e5" stroke-width="3" marker-end="url(#a)"/><rect x="550" y="12" width="230" height="160" rx="16" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/><circle cx="580" cy="44" r="15" fill="#4f46e5"/><text x="580" y="50" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">3</text><text x="604" y="51" font-size="18" font-weight="700" fill="#1f2937">Back to you</text><text x="568" y="92" font-size="14.5" fill="#4b5563">What only you can decide</text><text x="568" y="116" font-size="14.5" fill="#4b5563">becomes one list of to-dos</text><text x="568" y="140" font-size="14.5" fill="#4b5563">and questions.</text><line x1="784" y1="92.0" x2="814" y2="92.0" stroke="#4f46e5" stroke-width="3" marker-end="url(#a)"/><rect x="820" y="12" width="230" height="160" rx="16" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/><circle cx="850" cy="44" r="15" fill="#4f46e5"/><text x="850" y="50" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">4</text><text x="874" y="51" font-size="18" font-weight="700" fill="#1f2937">You decide</text><text x="838" y="92" font-size="14.5" fill="#4b5563">Your answer reaches the</text><text x="838" y="116" font-size="14.5" fill="#4b5563">project, and the next session,</text><text x="838" y="140" font-size="14.5" fill="#4b5563">in any tool, carries on.</text><path d="M935.0,176 V222 H125.0 V182" fill="none" stroke="#4f46e5" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#a)"/><rect x="280.0" y="208" width="500" height="28" rx="14" fill="#eef2ff"/><text x="530.0" y="227" text-anchor="middle" font-size="15" fill="#1f2937">the next session starts from what is known, not from zero</text></g></svg>
