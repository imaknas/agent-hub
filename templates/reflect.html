<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weekly Reflect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;800&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column; the analysis leads, numbers and charts sit beside it as evidence. */
:root {
  --paper: #f6f8f7;
  --surface: #ffffff;
  --ink: #17202b;
  --muted: #5d6b78;
  --rule: #d9e1e3;
  --accent: #0f6b62;
  --accent-soft: #d8ece8;
  --night: #3d3b8e;
  --night-soft: #e3e2f5;
  --good: #1f7a3f;
  --warn: #a5610c;
  --bad: #b3372d;
  --heat-0: #eef2f2;
  --font-display: "Noto Serif TC", "Songti TC", serif;
  --font-body: "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11161b; --surface: #182027; --ink: #e7ecef; --muted: #98a6b2; --rule: #2a3540;
    --accent: #5cc3b5; --accent-soft: #1d3a37; --night: #a7a3ff; --night-soft: #2a2950;
    --good: #6cc98a; --warn: #e6a54f; --bad: #f08a80; --heat-0: #1c252d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11161b; --surface: #182027; --ink: #e7ecef; --muted: #98a6b2; --rule: #2a3540;
  --accent: #5cc3b5; --accent-soft: #1d3a37; --night: #a7a3ff; --night-soft: #2a2950;
  --good: #6cc98a; --warn: #e6a54f; --bad: #f08a80; --heat-0: #1c252d; color-scheme: dark;
}

body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.7; }
.wrap { max-width: 860px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 64px; display: grid; gap: 44px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
p { margin: 0; }
.eyebrow { font-family: var(--font-data); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

/* header */
.top { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
.top select { font: inherit; font-family: var(--font-data); font-size: 14px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--rule); border-radius: 6px; padding: 6px 10px; }
.top select:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hero { display: grid; gap: 16px; }
.hero h1 { font-size: clamp(26px, 5vw, 38px); line-height: 1.3; font-weight: 800; }
.hero .summary { font-size: 17px; max-width: 65ch; }

/* key figures: supporting, not the point */
.figures { display: flex; flex-wrap: wrap; gap: 10px 28px; border-block: 1px solid var(--rule); padding-block: 14px; }
.fig { display: grid; gap: 0; min-width: 0; }
.fig b { font-family: var(--font-data); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
.fig span { font-size: 13px; color: var(--muted); }
.fig .delta { font-family: var(--font-data); font-size: 12px; }
.up { color: var(--warn); } .down { color: var(--muted); }
.fig.night b { color: var(--night); }

section { display: grid; gap: 18px; }
section > header { display: grid; gap: 4px; }
section h2 { font-size: 22px; font-weight: 600; }

/* insights */
.insights { display: grid; gap: 14px; }
.insight { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 18px 20px; display: grid; gap: 10px; }
.insight h3 { font-size: 18px; font-weight: 600; }
.evidence { font-family: var(--font-data); font-size: 13px; line-height: 1.6; color: var(--muted); border-left: 2px solid var(--accent-soft); padding-left: 10px; }
.sowhat { font-weight: 500; color: var(--accent); }

/* rhythm */
.verdict { font-family: var(--font-display); font-size: 19px; font-weight: 600; }
.heat-wrap { overflow-x: auto; padding-bottom: 4px; }
.heat { display: grid; grid-template-columns: 26px repeat(24, minmax(16px, 1fr)); gap: 3px; min-width: 520px; font-family: var(--font-data); font-size: 11px; }
.heat .lab { color: var(--muted); display: flex; align-items: center; }
.heat .hr { color: var(--muted); text-align: center; }
.cell { aspect-ratio: 1; border-radius: 3px; background: var(--heat-0); }
.cell.n { box-shadow: inset 0 0 0 1px var(--night-soft); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); align-items: center; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }
.stops { display: flex; flex-wrap: wrap; gap: 8px; }
.stop { font-family: var(--font-data); font-size: 13px; border: 1px solid var(--rule); border-radius: 999px; padding: 2px 10px; background: var(--surface); }
.stop.late { border-color: var(--night); color: var(--night); background: var(--night-soft); }

/* projects */
.projects { display: grid; gap: 0; border-top: 1px solid var(--rule); }
.proj { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 6px 24px; padding-block: 16px; border-bottom: 1px solid var(--rule); }
.proj .main { display: grid; gap: 6px; min-width: 0; }
.proj .name { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.proj .name strong { font-family: var(--font-data); font-weight: 500; font-size: 15px; }
.chip { font-size: 12px; font-weight: 700; border-radius: 4px; padding: 1px 8px; letter-spacing: .04em; }
.s-advancing { background: var(--accent-soft); color: var(--accent); }
.s-stable { background: var(--heat-0); color: var(--muted); }
.s-wrapping_up { background: var(--heat-0); color: var(--muted); }
.s-stuck { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.s-diverging { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.proj .focus { font-size: 14px; color: var(--muted); }
.proj .next { font-size: 14px; }
.proj .next::before { content: attr(data-label); font-weight: 700; color: var(--accent); }
.proj .side { display: grid; gap: 6px; align-content: start; font-family: var(--font-data); font-size: 12px; color: var(--muted); }
.bars { display: grid; gap: 3px; }
.bar { height: 6px; border-radius: 3px; background: var(--accent); }
.bar.prev { background: var(--rule); }
.mini { display: flex; justify-content: space-between; }
.quiet-list { font-size: 14px; color: var(--muted); }

/* fluency */
.fluency { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.fl { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 16px 18px; display: grid; gap: 8px; align-content: start; }
.fl header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.fl h3 { font-size: 18px; font-weight: 600; }
.fl .en { font-family: var(--font-data); font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.lv { font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 4px; }
.lv-strength { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
.lv-stable { background: var(--heat-0); color: var(--muted); }
.lv-needs_work { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.quote { font-size: 14px; color: var(--muted); }
.quote::before { content: attr(data-open); } .quote::after { content: attr(data-close); }
.tip { font-size: 14px; border-top: 1px dashed var(--rule); padding-top: 8px; }

/* next week */
.actions { display: grid; gap: 14px; counter-reset: a; padding: 0; margin: 0; list-style: none; }
.actions li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 4px 12px; counter-increment: a; }
.actions li::before { content: counter(a); grid-row: span 2; font-family: var(--font-data); font-size: 15px; width: 28px; height: 28px; border-radius: 50%;
  background: var(--accent); color: var(--surface); display: grid; place-items: center; }
.actions .act { font-weight: 500; }
.actions .why { font-size: 14px; color: var(--muted); }

.notice { background: var(--surface); border: 1px dashed var(--rule); border-radius: 10px; padding: 16px 18px; color: var(--muted); }
footer.method { font-size: 13px; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 16px; display: grid; gap: 6px; }

@media (max-width: 640px) {
  .proj { grid-template-columns: minmax(0, 1fr); }
  .fluency { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: no-preference) {
  .wrap > * { animation: rise .35s ease-out both; }
  @keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
}
</style>

<div class="wrap" id="app"></div>

<script>
const WEEKS = /*__REFLECT_DATA__*/[];
// The page's texts in the UI language and the names it shows: bin/weekly-reflect.py fills PAGE from the catalog
// (locales/<lang>/reflect.html.json, msgid = the English text each t call passes). Placeholders {name}; {n:one|other} is a plural
// choice. The analysis's classifications are v2 ids (weekly-reflect.py turns a v1 week's values into them).
const PAGE = /*__REFLECT_PAGE__*/{"text": {}, "assistant": ""};
const t = (id, kw = {}) => (PAGE.text[id] ?? id).replace(/\{(\w+)(?::([^{}|]*)\|([^{}]*))?\}/g,
  (m, k, one, other) => !(k in kw) ? m : one === undefined ? String(kw[k]) : (Number(kw[k]) === 1 ? one : other));
const STATUS = { advancing: t("Advancing"), stable: t("Stable"), stuck: t("Stuck"), diverging: t("Diverging"),
  wrapping_up: t("Wrapping up") };
const LEVEL = { strength: t("Strength"), stable: t("Stable"), needs_work: t("Needs work") };
// the 4D framework's own names, shown under each dimension's name in the UI language
const DIMS = { delegation: "Delegation", description: "Description", discernment: "Discernment", diligence: "Diligence" };
const DIM = { delegation: t("Delegation"), description: t("Description"), discernment: t("Discernment"),
  diligence: t("Diligence") };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = x => Math.round(x * 100) + "%";

function delta(now, prev) {
  if (!prev && !now) return "";
  const d = now - prev, r = prev ? Math.round(d / prev * 100) : null;
  const cls = d > 0 ? "up" : "down";
  return `<span class="delta ${cls}">${d > 0 ? "+" : ""}${d}${r !== null ? ` (${r > 0 ? "+" : ""}${r}%)` : ""}</span>`;
}

function heatColor(n, max) {
  if (!n) return "var(--heat-0)";
  const t = Math.max(.18, n / max);
  return `color-mix(in srgb, var(--accent) ${Math.round(t * 100)}%, var(--heat-0))`;
}

function heatmap(matrix) {
  const max = Math.max(1, ...matrix.flat());
  const days = t("Mon Tue Wed Thu Fri Sat Sun").split(" ");
  let h = `<div class="heat" role="img" aria-label="${t("Messages by weekday × hour")}"><span></span>`;
  for (let hr = 0; hr < 24; hr++) h += `<span class="hr">${hr % 3 === 0 ? hr : ""}</span>`;
  matrix.forEach((row, d) => {
    h += `<span class="lab">${days[d]}</span>`;
    row.forEach((n, hr) => {
      const night = hr < 6 ? " n" : "";
      const hour = String(hr).padStart(2, "0");
      h += `<span class="cell${night}" style="background:${heatColor(n, max)}" title="${t("{day} {hour}:00 · {n} {n:message|messages}", { day: days[d], hour: hour, n: n })}"></span>`;
    });
  });
  return h + `</div>`;
}

function projectRows(w) {
  const a = w.analysis || {};
  const byName = Object.fromEntries((a.projects || []).map(p => [p.name, p]));
  const max = Math.max(1, ...w.projects.map(p => Math.max(p.prompts, p.prompts_prev)));
  const active = w.projects.filter(p => p.prompts > 0);
  const quiet = w.projects.filter(p => p.prompts === 0 && p.prompts_prev > 0);
  let h = `<div class="projects">`;
  for (const p of active) {
    const an = byName[p.name] || {};
    h += `<div class="proj">
      <div class="main">
        <div class="name"><strong>${esc(p.name)}</strong>${an.status ? `<span class="chip s-${esc(an.status)}">${esc(STATUS[an.status] ?? an.status)}</span>` : ""}</div>
        ${an.focus ? `<p class="focus">${esc(an.focus)}</p>` : ""}
        ${an.assessment ? `<p>${esc(an.assessment)}</p>` : ""}
        ${an.next ? `<p class="next" data-label="${t("Next step")} ">${esc(an.next)}</p>` : ""}
      </div>
      <div class="side">
        <div class="bars" title="${t("Messages: this week {n} / last week {prev}", { n: p.prompts, prev: p.prompts_prev })}">
          <div class="bar" style="width:${Math.max(2, p.prompts / max * 100)}%"></div>
          <div class="bar prev" style="width:${Math.max(2, p.prompts_prev / max * 100)}%"></div>
        </div>
        <div class="mini"><span>${t("Messages")}</span><span class="num">${p.prompts} ← ${p.prompts_prev}</span></div>
        <div class="mini"><span>commit</span><span class="num">${p.commits ?? "—"}</span></div>
        <div class="mini"><span>${t("memory notes")}</span><span class="num">${p.notes ?? "—"}</span></div>
        <div class="mini"><span>${t("active days / sessions")}</span><span class="num">${p.days} / ${p.sessions}</span></div>
      </div>
    </div>`;
  }
  h += `</div>`;
  const quietList = quiet.map(p => t("{name} (last week {n})", { name: esc(p.name), n: p.prompts_prev })).join(t(", "));
  if (quiet.length) h += `<p class="quiet-list">${t("Quiet this week: {list}", { list: quietList })}</p>`;
  return h;
}

// which session sources the week was read from (weekly-reflect.py's "sources"; weeks before it have none)
function sourceName(n) {
  return n === "claude-code" ? "Claude Code" : n === "codex" ? "Codex" : n === "import" ? t("the import folder") : n;
}

function dataLine(w) {
  if (w.sources && w.sources.length) {
    const list = esc(w.sources.map(sourceName).join(t(", ")));
    return w.timezone ? t("Data: sessions on this machine from {sources}. Only the messages you actually sent count. Times are in {zone}.", { sources: list, zone: esc(w.timezone) })
      : t("Data: sessions on this machine from {sources}. Only the messages you actually sent count.", { sources: list });
  }
  return w.timezone ? t("Data: the coding agent's sessions on this machine. Only the messages you actually sent count. Times are in {zone}.", { zone: esc(w.timezone) }) : t("Data: the coding agent's sessions on this machine. Only the messages you actually sent count.");
}

function render(w) {
  const a = w.analysis && !w.analysis.error ? w.analysis : null;
  const t_ = w.totals, r = w.rhythm, d = w.delegation;
  const opts = WEEKS.map(x => `<option value="${esc(x.week)}"${x.week === w.week ? " selected" : ""}>${esc(x.week)} · ${esc(x.start.slice(5))}–${esc(x.end.slice(5))}</option>`).join("");
  const notice = w.unsupported ? t("No conversation statistics: {reason}", { reason: w.unsupported })
    : (w.analysis?.error || t("This week has only statistics; no analysis was made."));
  let h = `
  <div class="top">
    <span class="eyebrow">${t("brunna weekly review · {start} – {end}", { start: esc(w.start), end: esc(w.end) })}</span>
    ${WEEKS.length > 1 ? `<label><span class="eyebrow" style="margin-right:8px">${t("Week")}</span><select id="week">${opts}</select></label>` : ""}
  </div>
  <div class="hero">
    <h1>${esc(a ? a.headline : t("{week} activity statistics", { week: w.week }))}</h1>
    ${a ? `<p class="summary">${esc(a.summary)}</p>` : `<p class="notice">${esc(notice)}</p>`}
  </div>
  <div class="figures">
    <div class="fig"><b>${t_.prompts}</b><span>${t("messages")} ${delta(t_.prompts, t_.prompts_prev)}</span></div>
    <div class="fig"><b>${t_.projects}</b><span>${t("projects")}</span></div>
    <div class="fig"><b>${t_.sessions}</b><span>${t("sessions")}</span></div>
    <div class="fig"><b>${t_.days}/7</b><span>${t("days with work")}</span></div>
    <div class="fig night"><b>${pct(r.late_share)}</b><span>${t("late-night messages")} ${delta(r.late, r.late_prev)}</span></div>
    <div class="fig"><b>${r.longest_hours}h</b><span>${t("longest stretch")}</span></div>
  </div>`;

  if (a) {
    h += `<section><header><span class="eyebrow">Insights</span><h2>${t("Patterns this week")}</h2></header><div class="insights">` +
      a.insights.map(i => `<article class="insight"><h3>${esc(i.title)}</h3><p>${esc(i.analysis)}</p>
        <p class="evidence">${esc(i.evidence)}</p><p class="sowhat">${esc(i.so_what)}</p></article>`).join("") + `</div></section>`;
  }

  h += `<section><header><span class="eyebrow">Rhythm</span><h2>${t("Working hours")}</h2></header>
    ${a ? `<p class="verdict">${esc(a.rhythm.verdict)}</p><p>${esc(a.rhythm.analysis)}</p><p class="muted">${esc(a.rhythm.pattern)}</p>` : ""}
    <div class="heat-wrap">${heatmap(w.matrix)}</div>
    <div class="legend"><span><i class="sw" style="background:var(--accent)"></i>${t("The more messages, the darker")}</span>
      <span><i class="sw" style="box-shadow:inset 0 0 0 1px var(--night);background:var(--heat-0)"></i>${t("00:00–05:59 late night")}</span></div>
    <div><p class="eyebrow" style="margin-bottom:8px">${t("When work ended each day (the last message; before 6 a.m. counts as the day before)")}</p>
      <div class="stops">${r.last_per_day.map(x => `<span class="stop${x.late ? " late" : ""}">${esc(x.day)} ${esc(x.time)}</span>`).join("")}</div></div>
  </section>`;

  h += `<section><header><span class="eyebrow">Projects</span><h2>${t("By project")}</h2>
      <p class="muted" style="font-size:14px">${t("The bars on the right: this week's messages on top, last week's in grey below.")}</p></header>${projectRows(w)}</section>`;

  if (a) {
    const collab = t("{agents} {agents:subagent|subagents} this week (last week {agents_prev}), {peer} {peer:message|messages} between sessions (last week {peer_prev}).",
      { agents: d.agents, agents_prev: d.agents_prev, peer: d.peer, peer_prev: d.peer_prev });
    h += `<section><header><span class="eyebrow">AI fluency · 4D</span><h2>${t("How the work with AI went")}</h2>
      <p class="muted" style="font-size:14px">${collab}</p></header>
      <div class="fluency">` + a.fluency.map(f => {
        const name = DIM[f.dimension] ?? f.dimension, en = DIMS[f.dimension] || "";
        return `<article class="fl"><header><div><h3>${esc(name)}</h3><span class="en">${en !== name ? en : ""}</span></div>
        <span class="lv lv-${esc(f.level)}">${esc(LEVEL[f.level] ?? f.level)}</span></header>
        <p>${esc(f.observation)}</p>${f.quote ? `<p class="quote" data-open="${t("“")}" data-close="${t("”")}">${esc(f.quote)}</p>` : `<p class="evidence">${esc(f.evidence)}</p>`}<p class="tip">${esc(f.suggestion)}</p></article>`;
      }).join("") + `</div></section>`;
    h += `<section><header><span class="eyebrow">Next week</span><h2>${t("Do these first next week")}</h2></header><ol class="actions">` +
      a.next_week.map(n => `<li><span class="act">${esc(n.action)}</span><span class="why">${esc(n.why)}</span></li>`).join("") + `</ol></section>`;
  }

  const m = w.analysis?.meta;
  const excluded = esc((m?.excluded || []).join(t(", ")));
  const undigested = m && !m.complete ? t("; {n} more {n:session has|sessions have} no summary", { n: m.undigested || 0 }) : "";
  h += `<footer class="method">
    <p>${dataLine(w)}</p>
    ${m && m.source === "stats+digests" ? `<p>${t("The analysis was written by {model} from the statistics above and {digests} session {digests:summary|summaries} written by {assistant}'s local model; it is the model's reading, and the conversations' text is not sent to a cloud model. {withheld} work-related {withheld:session|sessions} and {excluded} count only in the statistics{undigested}.", { model: esc(m.model), digests: m.digests, assistant: esc(PAGE.assistant), withheld: m.withheld || 0, excluded: excluded, undigested: undigested })}</p>`
      : m && m.source === "stats" ? `<p>${t("The analysis was written by {model} from the statistics above only; it is the model's reading. The conversations' text is not sent to a cloud model, so it cannot see what the work was.", { model: esc(m.model) })}</p>`
      : m ? `<p>${t("The analysis was written by {model} from a sample of {sampled} messages and the statistics above; it is the model's reading. {excluded} only gave numbers, never text; strings that look like keys were masked before sending.", { model: esc(m.model), sampled: m.sampled, excluded: excluded })}</p>` : ""}
    <p class="num">${t("Generated {time}", { time: esc(w.generated) })}</p>
  </footer>`;
  return h;
}

function show(weekId) {
  const w = WEEKS.find(x => x.week === weekId) || WEEKS[0];
  const app = document.getElementById("app");
  if (!w) { app.innerHTML = `<p class="notice">${t("No week has a report yet.")}</p>`; return; }
  app.innerHTML = render(w);
  const sel = document.getElementById("week");
  if (sel) sel.addEventListener("change", e => { show(e.target.value); try { history.replaceState(null, "", "#" + e.target.value); } catch (_) {} });
}
show(decodeURIComponent(location.hash.slice(1)));
</script>
