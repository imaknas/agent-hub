# The checks a contribution must pass: lint; the whole test suite on Linux as an English instance (bin/linux-test) and
# on macOS as a zh-Hant one (bin/run-tests, the platform's own gate: Seatbelt, launchd and Keychain paths run only
# there); the one-line installer from this checkout through `agenthub init`; and a secret scan of the full history.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: bin/setup-python
      - run: bin/lint
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bin/linux-test
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: bin/setup-python
      - name: diag
        continue-on-error: true
        run: |
          which -a git; git --version; git config --system --list --show-origin || true
          git config --global --list --show-origin || true; git lfs version || true
          echo "TMPDIR=$TMPDIR HOME=$HOME"; sw_vers
          cd tests && ../bin/py -m unittest -v test_upgrade_idea.Upgrade.test_idea_with_capabilities_upgrades_and_keeps_them 2>&1 | head -150 || true
          ../bin/py -m unittest -v test_propose_apply.ProposeApply.test_dot_files_under_allowed_paths_are_never_applied 2>&1 | grep -v '^$' | head -200 || true
      - run: bin/run-tests
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: AGENT_HUB_REPO="$PWD" AGENT_HUB_REF="$GITHUB_SHA" AGENT_HUB_DIR="$RUNNER_TEMP/agent-hub" sh install.sh
      - run: |
          export PATH="$HOME/.local/bin:$PATH"
          agenthub --version
          agenthub init --yes --no-launchd --home "$RUNNER_TEMP/instance"
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.21.2 git /repo --no-banner --redact
