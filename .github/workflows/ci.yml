# The checks a contribution must pass: lint; the whole test suite on Linux as an English instance (bin/linux-test) and
# on macOS as an English one (bin/run-tests, the platform's own gate, which runs as zh-Hant locally: Seatbelt, launchd and Keychain paths run only
# there); the one-line installer from this checkout through `agenthub init`; and a secret scan of the full history.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A newer push to the same branch (or PR) cancels the run still going for an older one: every run tests the whole tree,
# so the newest run's result covers the commits before it, and stacked runs only burn runner time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: bin/setup-python
      - run: bin/lint
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bin/linux-test
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: bin/setup-python
      # an English instance here: the local gate (bin/run-tests) is the zh-Hant one on macOS, linux-test the English one
      # on Linux, so a test assuming either language fails somewhere
      - run: bin/run-tests
        env:
          AGENT_HUB_LANG_UI: en
          AGENT_HUB_LANG_CONTENT: en
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: BRUNNA_REPO="$PWD" BRUNNA_REF="$GITHUB_SHA" BRUNNA_DIR="$RUNNER_TEMP/brunna" sh install.sh
      - run: |
          export PATH="$HOME/.local/bin:$PATH"
          agenthub --version
          agenthub init --yes --no-launchd --home "$RUNNER_TEMP/instance"
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.21.2 git /repo --no-banner --redact
